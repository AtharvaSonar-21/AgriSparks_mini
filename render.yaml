# Exported and corrected Render blueprint configuration
version: "1"
projects:
  - name: My project
    environments:
      - name: Production
        services:
          # Backend API Web Service
          - type: web
            name: plant-disease-backend
            runtime: node
            plan: free
            rootDir: backend
            buildCommand: npm install && pip install -r requirements.txt || pip install numpy Pillow
            startCommand: node server.js
            envVars:
              - key: NODE_ENV
                value: production
              - key: PORT
                value: 10000
              - key: MONGODB_URI
                sync: false # User will supply MongoDB Atlas URL
              - key: CORS_ORIGIN
                sync: false # User will supply Frontend URL

          # Frontend Static Site (static sites are implicitly free, do not specify plan)
          - type: web
            name: plant-disease-frontend
            runtime: static
            rootDir: frontend
            buildCommand: npm install && npm run build
            staticPublishPath: dist
            envVars:
              - key: VITE_API_URL
                sync: false # Points to the backend URL
